name: Tag Organizer
description: Find remote tag gaps, sync matching tags, and review tag cleanup safely.
version: 1.10.0
url: https://github.com/mrx-31415/stash-plugins
exec:
  - python
  - "{pluginDir}/tag-organizer.py"
interface: raw
errLog: info

ui:
  javascript:
    - tag-organizer.js

settings:
  duplicateSimilarityCutoff:
    displayName: Duplicate similarity cutoff
    description: Minimum direct name or alias similarity for duplicate suggestions (0.7–1.0). Default 0.85; higher values are more conservative. Stored scores let this update existing new-format plans immediately.
    type: NUMBER
  syncOnTagCreate:
    displayName: Sync when a tag is created
    description: Scan every scene after creating a local tag. This can be slow on large libraries.
    type: BOOLEAN
  syncOnStashIdChange:
    displayName: Sync when scene metadata IDs change
    description: Sync a scene after its linked metadata-provider IDs change.
    type: BOOLEAN

hooks:
  - name: sync after tag creation
    description: Optionally sync all scenes after creating a local tag.
    triggeredBy:
      - Tag.Create.Post
  - name: sync after metadata ID update
    description: Optionally sync a scene when its linked metadata-provider IDs change.
    triggeredBy:
      - Scene.Update.Post

tasks:
  - name: Sync remote tags
    description: Add matching local tags from metadata providers to all linked scenes.
