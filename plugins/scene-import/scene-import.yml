name: Scene Import
description: Import scenes in the background and retry incomplete imports with StashDB and ThePornDB.
version: 0.6.3
exec:
  - scene-import-server.js
interface: js
tasks:
  - name: Scan & identify new scenes
    defaultArgs:
      mode: scan
  - name: Retry incomplete imports
    defaultArgs:
      mode: retry
ui:
  javascript:
    - scene-import.js
  css:
    - scene-import.css
