name: Check

# Builds the whole plugin source as a deploy would, against the live sources,
# and checks it, without publishing anything. Required on pull requests to main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check the plugin source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # build_site.sh versions in-repo plugins by their last commit.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml==6.0.3
      - run: python build_hub_test.py
      - run: |
          chmod +x build_site.sh
          ./build_site.sh _site/main
      - run: python build_hub.py _site --live https://mrx-31415.github.io/stash-plugins
      - run: python check_site.py _site
